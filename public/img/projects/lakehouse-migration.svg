<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#0D1E38"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132342"/>
      <stop offset="100%" stop-color="#0A162B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80"/>
    <line x1="0" y1="160" x2="600" y2="160"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
  </g>

  <!-- Header Banner -->
  <rect x="24" y="20" width="552" height="36" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.2)"/>
  <circle cx="44" cy="38" r="5" fill="#10B981"/>
  <text x="58" y="42" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">MODERNIZATION PIPELINE</text>
  <rect x="430" y="27" width="134" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
  <text x="497" y="42" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">40% FASTER RUNTIME</text>

  <!-- Node 1: Legacy Informatica -->
  <g transform="translate(30, 80)">
    <rect width="140" height="180" rx="10" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <rect x="15" y="15" width="110" height="28" rx="6" fill="rgba(245, 158, 11, 0.15)"/>
    <text x="70" y="34" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">Informatica</text>
    <text x="70" y="70" font-family="sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">Legacy PowerCenter</text>
    <text x="70" y="90" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">40+ Batch Mappings</text>
    <text x="70" y="115" font-family="sans-serif" font-size="10" fill="#64748B" text-anchor="middle">Rigid Schemas</text>
    <rect x="20" y="135" width="100" height="24" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.3)"/>
    <text x="70" y="151" font-family="sans-serif" font-size="10" font-weight="600" fill="#EF4444" text-anchor="middle">High Licensing</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M178 170 L216 170" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="216,165 226,170 216,175" fill="#38BDF8"/>

  <!-- Node 2: Azure Cloud Ingestion & Spark Engine -->
  <g transform="translate(230, 75)">
    <rect width="160" height="190" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.8"/>
    <rect x="15" y="15" width="130" height="28" rx="6" fill="rgba(56, 189, 248, 0.18)"/>
    <text x="80" y="34" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Azure Databricks</text>
    <text x="80" y="70" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">PySpark &amp; Spark SQL</text>
    <text x="80" y="95" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Cluster Autoscaling</text>
    <text x="80" y="115" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Broadcast Joins</text>
    <text x="80" y="135" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Partition Pruning</text>
    <rect x="20" y="150" width="120" height="22" rx="4" fill="rgba(2, 132, 199, 0.2)" stroke="#0284C7"/>
    <text x="80" y="165" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#38BDF8" text-anchor="middle">ADLS Gen2 Storage</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M398 170 L436 170" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="436,165 446,170 436,175" fill="#10B981"/>

  <!-- Node 3: Delta Lake Destination -->
  <g transform="translate(450, 80)">
    <rect width="125" height="180" rx="10" fill="url(#cardGrad)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <rect x="12" y="15" width="101" height="28" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="62" y="34" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Delta Lake</text>
    <text x="62" y="70" font-family="sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">ACID Lakehouse</text>
    <text x="62" y="90" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Schema Evolution</text>
    <text x="62" y="110" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Time Travel</text>
    <rect x="12" y="135" width="101" height="24" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10B981"/>
    <text x="62" y="151" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#10B981" text-anchor="middle">~30% Savings</text>
  </g>

  <!-- Footer status -->
  <text x="300" y="295" font-family="'Montserrat', sans-serif" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="0.5">Enterprise Cloud Migration · Zero Data Loss · Cognizant Delivery Excellence</text>
</svg>
