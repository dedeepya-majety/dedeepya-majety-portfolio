<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#0E223D"/>
    </linearGradient>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CD7F32"/>
      <stop offset="100%" stop-color="#8C501E"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Header Banner -->
  <rect x="24" y="20" width="552" height="36" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.2)"/>
  <circle cx="44" cy="38" r="5" fill="#38BDF8"/>
  <text x="58" y="42" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">DELTA LAKE MEDALLION ARCHITECTURE</text>
  <rect x="425" y="27" width="139" height="22" rx="11" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1"/>
  <text x="494" y="42" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">AUTO LOADER INGESTION</text>

  <!-- Tier 1: Bronze (Raw) -->
  <g transform="translate(35, 78)">
    <rect width="140" height="185" rx="10" fill="#0C172E" stroke="#CD7F32" stroke-width="1.5"/>
    <rect x="15" y="12" width="110" height="26" rx="6" fill="rgba(205, 127, 50, 0.2)"/>
    <text x="70" y="30" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#E59866" text-anchor="middle">BRONZE</text>
    <text x="70" y="65" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Raw Ingestion</text>
    <text x="70" y="88" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">cloudFiles Auto Loader</text>
    <text x="70" y="108" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Schema Inference</text>
    <text x="70" y="128" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">JSON / Parquet / CSV</text>
    <rect x="15" y="145" width="110" height="24" rx="4" fill="rgba(205, 127, 50, 0.15)"/>
    <text x="70" y="161" font-family="sans-serif" font-size="9.5" fill="#E59866" text-anchor="middle">Append Only</text>
  </g>

  <!-- Arrow Bronze to Silver -->
  <path d="M185 170 L218 170" stroke="#CBD5E1" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="218,165 228,170 218,175" fill="#CBD5E1"/>

  <!-- Tier 2: Silver (Cleaned) -->
  <g transform="translate(230, 75)">
    <rect width="140" height="190" rx="10" fill="#0C172E" stroke="#94A3B8" stroke-width="1.8"/>
    <rect x="15" y="12" width="110" height="26" rx="6" fill="rgba(203, 213, 225, 0.2)"/>
    <text x="70" y="30" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#CBD5E1" text-anchor="middle">SILVER</text>
    <text x="70" y="65" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Cleaned &amp; Validated</text>
    <text x="70" y="88" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">PySpark Quality Gates</text>
    <text x="70" y="108" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Deduplication</text>
    <text x="70" y="128" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Type Enforcement</text>
    <rect x="15" y="148" width="110" height="24" rx="4" fill="rgba(203, 213, 225, 0.15)"/>
    <text x="70" y="164" font-family="sans-serif" font-size="9.5" fill="#CBD5E1" text-anchor="middle">Conformed Entities</text>
  </g>

  <!-- Arrow Silver to Gold -->
  <path d="M380 170 L413 170" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="413,165 423,170 413,175" fill="#F59E0B"/>

  <!-- Tier 3: Gold (Curated) -->
  <g transform="translate(425, 78)">
    <rect width="140" height="185" rx="10" fill="#0C172E" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="15" y="12" width="110" height="26" rx="6" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="70" y="30" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" fill="#FCD34D" text-anchor="middle">GOLD</text>
    <text x="70" y="65" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Curated Business Tier</text>
    <text x="70" y="88" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Dimensional Star Schema</text>
    <text x="70" y="108" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Aggregates &amp; Metrics</text>
    <text x="70" y="128" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Unity Catalog RBAC</text>
    <rect x="15" y="145" width="110" height="24" rx="4" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="70" y="161" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#FCD34D" text-anchor="middle">Power BI Ready</text>
  </g>

  <!-- Footer -->
  <text x="300" y="295" font-family="'Montserrat', sans-serif" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="0.5">ACID Transactions · Unity Catalog Governance · Continuous Stream Processing</text>
</svg>
