<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080F1E"/>
      <stop offset="100%" stop-color="#0C1B33"/>
    </linearGradient>
  </defs>

  <rect width="600" height="320" rx="16" fill="url(#bgGrad3)"/>
  <rect x="1" y="1" width="598" height="318" rx="15" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="24" y="20" width="552" height="36" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.2)"/>
  <circle cx="44" cy="38" r="5" fill="#10B981"/>
  <text x="58" y="42" font-family="'Montserrat', sans-serif" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="1">HYBRID PIPELINE ORCHESTRATION</text>
  <rect x="420" y="27" width="144" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1"/>
  <text x="492" y="42" font-family="'Montserrat', sans-serif" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle">99.8% SLA ADHERENCE</text>

  <!-- Step 1: Git & Airflow Controller -->
  <g transform="translate(30, 80)">
    <rect width="155" height="180" rx="10" fill="#0C172E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <rect x="15" y="14" width="125" height="26" rx="6" fill="rgba(16, 185, 129, 0.18)"/>
    <text x="77" y="32" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Apache Airflow</text>
    <text x="77" y="68" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Python DAG Controller</text>
    <text x="77" y="92" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Dynamic Dependencies</text>
    <text x="77" y="112" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Task Retries &amp; SLAs</text>
    <text x="77" y="132" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Custom Python Hooks</text>
    <rect x="15" y="145" width="125" height="22" rx="4" fill="rgba(255, 255, 255, 0.05)"/>
    <text x="77" y="160" font-family="sans-serif" font-size="9.5" fill="#38BDF8" text-anchor="middle">Git-Versioned DAGs</text>
  </g>

  <!-- Arrow -->
  <path d="M192 170 L226 170" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="226,165 236,170 226,175" fill="#38BDF8"/>

  <!-- Step 2: Azure Data Factory (ADF) -->
  <g transform="translate(242, 75)">
    <rect width="165" height="190" rx="10" fill="#0C172E" stroke="rgba(56, 189, 248, 0.5)" stroke-width="1.8"/>
    <rect x="15" y="14" width="135" height="26" rx="6" fill="rgba(56, 189, 248, 0.2)"/>
    <text x="82" y="32" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">Azure Data Factory</text>
    <text x="82" y="68" font-family="sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Hybrid Execution Engine</text>
    <text x="82" y="92" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">ADLS Gen2 Copy Jobs</text>
    <text x="82" y="112" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Databricks Notebook Runs</text>
    <text x="82" y="132" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Scheduled Triggers</text>
    <rect x="15" y="150" width="135" height="22" rx="4" fill="rgba(2, 132, 199, 0.2)"/>
    <text x="82" y="165" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#38BDF8" text-anchor="middle">Failure Webhooks &amp; Alerts</text>
  </g>

  <!-- Arrow -->
  <path d="M415 170 L448 170" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4 3"/>
  <polygon points="448,165 458,170 448,175" fill="#10B981"/>

  <!-- Step 3: Target Lakehouse & Monitoring -->
  <g transform="translate(465, 80)">
    <rect width="110" height="180" rx="10" fill="#0C172E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5"/>
    <rect x="10" y="14" width="90" height="26" rx="6" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="55" y="32" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">Target Stores</text>
    <text x="55" y="68" font-family="sans-serif" font-size="10.5" fill="#E2E8F0" text-anchor="middle">ADLS Gen2</text>
    <text x="55" y="92" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Delta Tables</text>
    <text x="55" y="112" font-family="sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">Azure Monitor</text>
    <rect x="10" y="145" width="90" height="22" rx="4" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="55" y="160" font-family="sans-serif" font-size="9" font-weight="700" fill="#10B981" text-anchor="middle">Zero Drift</text>
  </g>

  <!-- Footer -->
  <text x="300" y="295" font-family="'Montserrat', sans-serif" font-size="11" fill="#64748B" text-anchor="middle" letter-spacing="0.5">Automated CI/CD · Pull Request Code Reviews · Real-time Incident Alerting</text>
</svg>
