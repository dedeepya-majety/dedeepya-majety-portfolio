<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 75" fill="none">
  <defs>
    <linearGradient id="savGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
  </defs>
  <!-- Card Background -->
  <rect width="280" height="75" rx="10" fill="#0B1528" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.2"/>
  
