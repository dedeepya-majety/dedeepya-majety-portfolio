    <!-- Book symbol inside crest -->
    <path d="M14 20 C18 18 22 19 22 22 C22 19 26 18 30 20 V32 C26 30 22 31 22 34 C22 31 18 30 14 32 Z" fill="none" stroke="#F59E0B" stroke-width="1.8"/>
    <!-- Star above -->
    <polygon points="22,6 23.5,10 28,10.5 24.5,13.5 25.5,18 22,15.5 18.5,18 19.5,13.5 16,10.5 20.5,10" fill="#FCD34D"/>
  </g>

  <!-- Typography -->
  <text x="70" y="36" font-family="'Montserrat', -apple-system, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="1">SAVEETHA</text>
  <text x="70" y="53" font-family="'Montserrat', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#F59E0B" letter-spacing="1.5">ENGINEERING COLLEGE</text>
